<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="./css/bootstrap.css" />
    <link rel="stylesheet" href="./css/loginstyle.css" />

    <title>Vinyl123</title>
    <style>
      header {
        background-image: url(images/VinylMePlease.jpg);
      }
    </style>
  </head>
  <body>
    <header class="container-fluid">
      <div class="img-container">
        <a href="index.html"><img src="./images/logoipsum-311.svg" alt="" class="logo" /></a>
      </div>
    </header>

    <section class="container d-flex justify-content-center">
      <form action="action_page.php">
        <div class="card">
          <h1>Sign Up</h1>
          <p>Create an account.</p>
          <hr />

          <label for="email"><b>Email</b></label>
          <input type="text" placeholder="Enter Email" name="email" id="email" class="formr" required />

          <label for="psw"><b>Password</b></label>
          <input type="password" placeholder="Enter Password" name="psw" id="psw" class="formx" required />

          <label for="psw-repeat"><b>Re-enter Password</b></label>
          <input
            type="password"
            placeholder="Re-enter Password"
            name="psw-repeat"
            id="psw-repeat"
            class="formq"
            required
          />
          <hr />
          <div>
            <p>How did you hear about us?</p>
            <label for="opt-0"><input type="radio" name="opt" id="opt-0" checked />Search/Google</label>
            <label for="opt-1"><input type="radio" name="opt" id="opt-1" />Event</label>
            <label for="opt-2"><input type="radio" name="opt" id="opt-2" />Friend or Family Member</label>
          </div>
          
          <p>By creating an account you agree to our <a href="#">Terms & Privacy</a>.</p>
          <button type="submit" class="registerbtn formd">Register</button>
        </div>

        <div class="container signin">
          <p>Already have an account? <a href="signin.html">Sign In</a>.</p>
        </div>
      </form>
    </section>
  </body>
</html>
