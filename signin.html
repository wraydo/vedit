<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="./css/bootstrap.css" />
    <link rel="stylesheet" href="./css/loginstyle.css" />
    <title>Vinyl123</title>
    <style>
      header {
        background-image: url(images/VinylMePlease.jpg);
      }

      .checkbox-container {
        display: flex;
        align-items: center;
        margin-top: 10px;
      }

      .checkbox-container input {
        margin-right: 8px; /* Reduces space between checkbox and label */
      }
    </style>
  </head>
  <body>
    <header class="container-fluid">
      <div class="img-container">
        <a href="index.html"><img src="./images/logoipsum-311.svg" alt="" class="logo" /></a>
      </div>
    </header>

    <section class="container d-flex justify-content-center align-items-center vh-100">
      <form action="action_page.php" class="w-100" style="max-width: 400px;">
        <div class="card p-4">
          <h1 class="text-center">Sign In</h1>
          <p class="text-center">Sign into your account</p>
          <hr />

          <div class="mb-3">
            <label for="email" class="form-label"><b>Email</b></label>
            <input
              type="text"
              class="form-control"
              placeholder="Enter Email"
              name="email"
              id="email"
              required
            />
          </div>

          <div class="mb-3">
            <label for="psw" class="form-label"><b>Password</b></label>
            <input
              type="password"
              class="form-control"
              placeholder="Enter Password"
              name="psw"
              id="psw"
              required
            />
          </div>

          <!-- Remember Me Checkbox -->
          <div class="checkbox-container">
            <input type="checkbox" id="remember" name="remember" />

            <label for="remember" class="form-label">Remember Me</label>
          </div>

          <hr />
          <p class="small">By creating an account, you agree to our <a href="#">Terms & Conditions</a>.</p>
          
          <button disabled type="submit" class="btn btn-primary w-100" id="signInBtn">Sign In</button>
        </div>

        <div class="container text-center mt-3">
          <p>Don't have an account? <a href="signup.html">Sign Up</a>.</p>
        </div>
      </form>
    </section>
    <script src="signin.js"></script>
  </body>
</html>
