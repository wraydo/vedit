<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="./css/bootstrap.css" />
    <link rel="stylesheet" href="./css/loginstyle.css" />

    <title>Vinyl123</title>
    <style>
      header {
        background-image: url(images/VinylMePlease.jpg);
      }
    </style>
  </head>
  <body>
    <header class="container-fluid">
      <div class="img-container">
        <a href="index.html"><img src="./images/logoipsum-311.svg" alt="" class="logo" /></a>
      </div>
    </header>

    <section class="container d-flex justify-content-center align-items-center">
      <form action="action_page.php">
        <div class="card">
          <h1>Sign In</h1>
          <p>Sign into your account</p>
          <hr />

          <label for="email"><b>Email</b></label>
          <input
            type="text"
            placeholder="Enter Email"
            name="email"
            id="email"
            required
          />

          <label for="psw"><b>Password</b></label>
          <input
            type="password"
            placeholder="Enter Password"
            name="psw"
            id="psw"
            required
          />

          <hr />

          <p>By creating an account you agree to our <a href="#">Terms & Conditions</a>.</p>
          <button type="submit" class="registerbtn">Sign In</button>
        </div>

        <div class="container signin">
          <p>Don't have an account? <a href="signup.html">Sign Up</a>.</p>
        </div>
      </form>
    </section>
  </body>
</html>
